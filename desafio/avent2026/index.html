     "2": "¡Hola, Paco! Soy Andrés y tengo un puesto en el mercado de Navidad de la Plaza Mayor. Hay muchos puestos: hay figuritas para el belén, hay pelucas de colores y hay dulces. En mi puesto hay un pastor, una oveja y un río de papel. Hoy hay un décimo en el suelo, cerca de una señora con delantal…",
     "3": "¡Hola, Paco! Soy Andrés, tengo sesenta años y vendo figuritas en el mercado de la Plaza Mayor desde hace treinta años. En diciembre hay más de cien puestos: hay figuritas del belén, hay pelucas y bromas para Nochevieja, y hay un olor a bocadillo de calamares por todas partes. En mi puesto hay pastores, ovejas, un río y una lavandera. Esta tarde hay un décimo en el suelo de la plaza: una señora con delantal blanco salió corriendo. ¿Es el décimo del lycée?",
     "4": "¡Hola, Paco! Soy Andrés, del mercado de la Plaza Mayor. Te explico dónde está todo, por si vienes: mi puesto está al lado de la estatua de Felipe III, entre un puesto de pelucas y uno de dulces. Delante de mi puesto hay una fuente pequeña y, detrás, está la panadería de una señora con delantal blanco. Las figuritas están encima de una mesa de madera y el musgo está debajo del río de papel. Esta tarde, encontré un décimo en el suelo, cerca de la esquina, justo enfrente de la panadería. ¿Será el décimo robado?",
     "5": "Querido Paco: esta tarde ha pasado algo muy raro en mi puesto. Una señora con delantal blanco llegó con prisa, compró tres figuritas del belén, pagó con un billete lleno de harina y, al sacar la cartera, se le cayó un papel. Cuando lo recogí, vi que era un décimo de lotería. Corrí detrás de ella, pero desapareció entre la gente. Luego, mi vecino del puesto de pelucas me explicó que esa señora había comprado una peluca rubia la semana anterior. ¿Por qué querría disfrazarse? Te guardo el décimo: tiene harina en una esquina.",
     "6": "Querido Paco: aquí en los Madriles, el mercado de la Plaza Mayor es de lo más castizo que hay: desde mediados del siglo XIX se venden aquí figuritas de belén, musgo y corcho, y los chavales vienen a por pelucas y bromas para Nochevieja. Yo soy gato de cuarta generación y, ya ves, sigo al pie del cañón. Esta tarde, una señora más chula que un ocho, con delantal blanco y las manos llenas de harina, se dejó caer por mi puesto, soltó un décimo sin enterarse y se piró a toda pastilla. ¡Qué fuerte! Lo tengo guardado: huele a mantequilla."
    }
   },

    "texto": {
     "1": "Fábrica La Estepeña. En Estepa, en Andalucía, las trabajadoras fabrican polvorones. Usan harina, azúcar y manteca. En diciembre venden muchos polvorones. ¡Visita la fábrica!",
     "2": "Fábrica La Estepeña, Estepa (Sevilla). Aquí las trabajadoras fabrican polvorones y mantecados desde hace cien años. Mezclan harina, azúcar, manteca y almendras. Luego envuelven cada polvorón en papel. En diciembre trabajan mucho y venden millones. Atención: no usan mantequilla.",
     "3": "Fábrica La Estepeña, Estepa (Sevilla). En Estepa hay más de veinte fábricas de polvorones y mantecados. En otoño, cientos de trabajadoras llegan al pueblo: mezclan la harina tostada con la manteca y el azúcar, cortan los polvorones y los envuelven a mano en papel de seda. Los camiones salen cada día hacia toda España. Los polvorones de Estepa llevan manteca de cerdo, nunca mantequilla. Horario de visitas: de 10 a 14 h. El almacén está detrás de la fábrica.",
     "4": "Fábrica La Estepeña. Estepa es un pueblo de la provincia de Sevilla y es famoso por sus polvorones. Nuestra fábrica es familiar: es de la familia Ruiz desde 1920. El polvorón es un dulce pequeño y frágil: es de harina tostada, manteca y azúcar. En diciembre, la fábrica está llena de trabajadoras y el pueblo huele a canela. Hoy el almacén está cerrado por inventario, pero la tienda está abierta. Aviso para los detectives: el señor Polvorón está en el almacén toda la semana; sus polvorones son de manteca, no de mantequilla.",
     "5": "Fábrica La Estepeña. Los primeros mantecados de Estepa fueron elaborados en el siglo XVI por las monjas del convento de Santa Clara, que aprovechaban los excedentes de cereal y de manteca de cerdo. Fue en el siglo XIX cuando una vecina, Filomena Micaela Ruiz, tuvo la idea de venderlos en Córdoba, y desde entonces se fabrican aquí millones cada otoño. Hoy son protegidos por una Indicación Geográfica, y cada pieza es envuelta a mano por las obreras. Aviso: el Tío Polvorón no ha salido del almacén en toda la semana; además, nuestros dulces no llevan mantequilla, sino manteca.",
     "6": "Fábrica La Estepeña. ¡Quillo, que esto es Estepa! Aquí, de septiembre a diciembre, el pueblo entero huele a canela y er polvorón manda. Las mujeres del pueblo, que son mu apañás, envuelven a mano miles de piezas al día, y como diga alguien que el polvorón se hace con mantequilla, se lía parda, miarma: aquí to' se hace con manteca de cerdo ibérico, como Dios manda. ¡Ozú, qué arte! Aviso pa' los detectives: el Tío Polvorón no se ha movío der almacén en toa la semana, así que ese delantal blanco con olor a mantequilla no es cosa suya."

     "2": "Queridos Reyes Magos: me llamo Lucía, tengo siete años y vivo en Valladolid. Este año soy muy buena: ayudo a mi madre y hago los deberes. Quiero una bicicleta roja, un libro de piratas y un juego para mi hermano. La noche del 5 de enero dejo mis zapatos y agua para los camellos. Lucía. P. D.: ¡Carbón no, por favor!",
     "3": "Queridos Reyes Magos: me llamo Lucía, tengo siete años y vivo en Valladolid. Este año he sido bastante buena, aunque a veces me peleo con mi hermano Pablo. Os pido una bicicleta roja, un libro de piratas y unos patines. Para Pablo, un balón (es pequeño, pero también quiere regalos). La noche del 5 de enero voy a ver la cabalgata y luego voy a dejar mis zapatos en el balcón, con agua y paja para los camellos y tres turrones para vosotros. El 6 por la mañana vamos a comer roscón: ¡ojalá me toque la sorpresa! Lucía",
     "4": "Queridos Reyes Magos: me llamo Lucía y os escribo desde Valladolid. La bicicleta roja, ¿me la traéis este año? El año pasado la pedí, pero no la vi debajo del árbol. A mi hermano Pablo traedle un balón; él lo quiere de su equipo. A mi abuela, una bufanda: la necesita para el invierno. Los zapatos los voy a dejar en el balcón, y el agua para los camellos la pongo al lado. Melchor, a ti te dejo turrón, porque sé que te gusta. Os quiere, Lucía. P. D.: Si alguien os pide un roscón con un décimo dentro, ¡no se lo deis!",
     "5": "Queridos Reyes Magos: espero que este año me traigáis la bicicleta roja que os pedí el año pasado. No quiero que penséis que soy egoísta: también os pido que a mi abuela le llegue una bufanda calentita y que mi hermano Pablo deje de quitarme los rotuladores. Ojalá haga buen tiempo en la cabalgata y que Baltasar me vea saludar. Mamá dice que, si me porto mal, me dejaréis carbón, pero yo creo que es de azúcar. Una última cosa: una señora con delantal blanco ha encargado un roscón enorme en la panadería del barrio y ha pedido que le escondan «su tesoro» dentro. ¿Os parece normal?",
     "6": "Majestades: con el debido respeto, me dirijo a Vuestras Majestades para elevar la petición anual de esta humilde servidora. Huelga decir que mi conducta ha sido intachable, salvo algún que otro rifirrafe con mi hermano, del que, por otra parte, no me considero responsable. Solicito, pues, la bicicleta roja que en su día quedó pendiente, y me permito sugerir que, a falta de sitio en los camellos, prioricen el regalo de mi abuela. Les ruego, por último, que extremen la vigilancia en la panadería del barrio: una señora con delantal blanco ha encargado un roscón descomunal con un «tesoro» dentro. Quedo a la espera de sus noticias. Atentamente, Lucía."
    }

};

  return '<div class="bravo" style="position:relative;z-index:2;text-align:center;font-size:20pt;font-weight:bold;color:#c62828;margin-top:8px">¡Bravo, detective !<small style="display:block;font-size:13px;color:#333;font-weight:normal">Tu as résolu les ' + SC.dias + ' enquêtes · ¡Felicidades!<br>Envoie tes coffres à EspaBox (Wi-Fi du lycée) : +100 XP bonus</small></div>';
}
function romperPinata() {
  PINATA_COUPS++;
  const b = $('#pinata'); if (!b) return;
  b.style.transform = 'rotate(' + (PINATA_COUPS % 2 ? -14 : 14) + 'deg) scale(' + (1 + PINATA_COUPS * 0.08) + ')';
  if (PINATA_COUPS < 3) return;
  b.style.display = 'none';
  const z = $('#pz'); if (!z) return;
  const cols = ['#e53935', '#fdd835', '#43a047', '#1e88e5', '#8e24aa', '#fb8c00'];
  let html = '';
  for (let i = 0; i < 80; i++) html += '<i class="conf" style="left:' + (Math.random() * 100).toFixed(1) + '%;background:' + cols[i % cols.length] + ';animation-delay:' + (Math.random() * 0.6).toFixed(2) + 's;animation-duration:' + (1.8 + Math.random() * 1.6).toFixed(2) + 's"></i>';
  z.insertAdjacentHTML('beforeend', '<div class="confetis">' + html + '</div>' + pinataBravo());
  ST.pinata = true; guardar();
}
function pinataHTML(complet) {
  if (!complet) return '';
  const style = '<style>.conf{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:confetti linear forwards}@keyframes confetti{to{transform:translateY(260px) rotate(720deg);opacity:0}}.confetis{position:absolute;inset:0;pointer-events:none;overflow:hidden}</style>';
  if (ST.pinata) return '<div id="pz" style="position:relative;overflow:hidden;text-align:center;margin:10px 0;min-height:120px">' + style + pinataBravo() + '</div>';
  return '<div id="pz" style="position:relative;overflow:hidden;text-align:center;margin:10px 0;min-height:150px">' + style +
    '<button id="pinata" type="button" style="font-size:64px;background:none;border:0;cursor:pointer;transition:transform .15s">🪅</button>' +
    '<p class="es" style="margin:2px 0 0">Casse la piñata ! · ¡Rompe la piñata!</p></div>';
}
function inicio() {
  stopMec(); window.scrollTo(0, 0);
  const s = stats();
  $('#hwho').textContent = PROF ? 'Prof' : (ST.token ? 'EspaBox ✔' : 'Invité');
  let h = pacoHTML(SC.intro_fr || '', SC.intro_es || '');
  h += `<div class="stats">
    <div class="stat"><b>${s.ok}/${SC.dias}</b><small>Coffres<br>Cofres</small></div>
    <div class="stat"><b>🔥${s.best}</b><small>Meilleure série<br>Racha</small></div>
    <div class="stat"><b>🎟️${SC.loteria ? s.ok : '—'}</b><small>Décimos</small></div>
    <div class="stat"><b>${s.nota == null ? '—' : fmt(s.nota)}</b><small>Note /20<br>${ST.token ? 'Nota' : 'EspaBox'}</small></div></div>`;
  if (SC.frase) h += `<div class="frase">${esc(fraseVista())}<small>Phrase mystère · Frase misteriosa</small></div>`;
  h += pinataHTML(s.ok === SC.dias);
  h += '<div class="grid">';
  for (let n = 1; n <= SC.dias; n++) {
    const c = caso(n), d = fechaCaso(n), ok = ST.casos[n] && ST.casos[n].ok;
    let cl = 'door';
    if (ok) cl += ' done'; else if (!abierto(n)) cl += ' locked'; else if (!esHoy(n)) cl += ' late';
    if (esHoy(n)) cl += ' today';
    const sub = ok ? '✅' : (abierto(n) && c ? esc(c.bandera || '') : d.getDate() + '/' + (d.getMonth() + 1));
    h += `<button class="${cl}" data-d="${n}">${n}<small>${sub}</small></button>`;
  }
  h += '</div><div class="msg" id="msg"></div>';
  if (!PROF) h += `<p class="es" style="text-align:center;margin-top:10px">Niveau : ${nivInfo().ic} ${esc(nivInfo().fr)}</p>`;
  h += `<button class="btn sec" id="bmet2">🔍 La méthode du détective<span class="es">El método</span></button>`;
  h += `<button class="btn sec" id="bsus">🕵️ Tableau des suspects<span class="es">Sospechosos</span></button>`;
  if ((SC.casos || []).some(c => c.tipo === 'investigacion')) h += `<button class="btn sec" id="bcar">📓 Mon carnet d'enquêteur<span class="es">Mi cuaderno de detective</span></button>`;
  if (SC.loteria) h += `<button class="btn sec" id="bdec">🎟️ Mes décimos<span class="es">Mis décimos</span></button>`;
  if (ST.token && SC.espabox_url && !PROF) h += `<button class="btn" id="benv">📤 Envoyer à EspaBox<span class="es">Enviar a EspaBox</span></button>`;
  if (!PROF) h += `<button class="btn sec" id="bniv">⚙️ Changer de niveau<span class="es">Cambiar de nivel</span></button>`;
  $('#app').innerHTML = h;
  if ($('#pinata')) $('#pinata').onclick = romperPinata;
  document.querySelectorAll('.door').forEach(b => b.onclick = () => {
    const n = +b.dataset.d;
    if (!abierto(n)) return msg('Ce coffre s\'ouvre le ' + fechaCaso(n).toLocaleDateString('fr-FR', { day: 'numeric', month: 'long' }) + '.', 'ko');
    if (!caso(n)) return msg('Coffre en préparation · En preparación', 'ko');
    abrirCaso(n);
  });
  $('#bsus').onclick = tablero;
  $('#bmet2').onclick = vistaMetodo;
  if ($('#bdec')) $('#bdec').onclick = vistaDecimos;
  if ($('#bcar')) $('#bcar').onclick = vistaCarnet;
  if ($('#benv')) $('#benv').onclick = vistaEnviar;
  if ($('#bniv')) $('#bniv').onclick = elegirNivel;
}

function abrirCaso(n) {
  window.DIA_ACTUAL = n;
  stopMec(); window.scrollTo(0, 0);
  const c = caso(n), ya = ST.casos[n] && ST.casos[n].ok;
  let h = `<div class="card"><span class="tag">${esc(c.bandera || '')} ${esc(c.pais || '')}</span><span class="tag">Coffre ${n}</span>` +
    `<h2 style="margin:8px 0">${esc(L(c.titulo))}</h2><p style="margin:0">${esc(L(c.historia))}</p>` +
    (c.audio ? `<button class="btn sec" id="baud">🔊 Écouter<span class="es">Escuchar</span></button>` : '') + `</div>`;
  if (c.consigna) h += pacoHTML(L(c.consigna.fr), L(c.consigna.es));
  if (ya) h += `<p class="msg ok">✅ Coffre déjà ouvert : tu peux rejouer pour le plaisir.</p>`;
  h += `<div class="card" id="mec"></div><div id="pistas"></div><div class="msg" id="msg"></div>`;
  h += `<button class="btn" id="bval">✅ Valider<span class="es">Validar</span></button>`;
  const P = (L(c.pistas) || []).map(L);
  if (P.length) h += `<button class="btn sec" id="bpis">💡 Indice (<span id="np">${P.length}</span>)<span class="es">Pista · la 1re est gratuite</span></button>`;
  if (PROF) h += `<div class="sol">🔑 ${esc(JSON.stringify(solucionDe(c)))}</div>`;
  h += `<button class="btn sec" id="bvol">← Retour au calendrier<span class="es">Volver al calendario</span></button>`;
  $('#app').innerHTML = h;
  if ($('#baud')) $('#baud').onclick = () => audio(c.audio);
  const M = MEC[c.tipo];
  if (!M) { $('#mec').textContent = 'Mécanique inconnue : ' + c.tipo; return; }
  const ctl = M($('#mec'), c);
  STOP = ctl.stop || null;
  const majBouton = () => { if (ctl.etiqueta) $('#bval').innerHTML = ctl.etiqueta(); };
  majBouton();
  let pis = 0;
  if ($('#bpis')) $('#bpis').onclick = () => {
    if (pis >= P.length) return;
    $('#pistas').insertAdjacentHTML('beforeend', `<div class="card">💡 ${esc(P[pis])}</div>`);
    pis++; $('#np').textContent = P.length - pis;
  };
  $('#bval').onclick = () => {
    const r = ctl.check();
    if (r === null) return msg(ctl.vide ? ctl.vide() : 'Termine d\'abord · Termina primero', 'ko');
    if (r === 'next') { msg('', ''); majBouton(); return; }
    if (r) exito(n, c, pis); else msg('Pas encore… · ¡Inténtalo otra vez!', 'ko');
  };
  $('#bvol').onclick = inicio;
}

function exito(n, c, pis) {
  stopMec();
  const ya = ST.casos[n] && ST.casos[n].ok;
  if (!ya) {
    ST.casos[n] = { ok: 1, ts: ahora(), p: pis, nv: ST.nivel };
    if (!PROF) ST.cola.push({ sc: SC.id, u: uid(), d: n, nv: ST.nivel, p: pis, ts: ST.casos[n].ts, eb: ST.token ? 1 : 0 });
    guardar(); vaciarCola();
  }
  const sus = c.elimina && (SC.sospechosos || []).find(s => s.id === c.elimina);
  const M = SC.mascota || {};
  let h = `<div class="card reward">${M.imagen ? `<img src="${esc(M.imagen)}" alt="">` : `<div style="font-size:3rem">${esc(M.emoji || '🎉')}</div>`}` +
    `<h2>Coffre ouvert !<span class="es">¡Cofre abierto!</span></h2>`;
  if (c.recompensa) h += `<p>${esc(L(c.recompensa))}</p>`;
  if (sus) h += `<p>🕵️ ${esc(sus.emoji)} ${esc(sus.nombre)} : inocente ❌</p>`;
  if (SC.loteria) h += `<p>Ton décimo · Tu décimo<br><span class="decimo">🎟️ ${decimo(n)}</span></p>`;
  if (ST.reglas[n]) h += `<p class="regla" style="background:#ffffff14;border-radius:8px;padding:6px">🔎 ${esc(ST.reglas[n])}</p>`;
  if (ST.carnet[n]) h += `<p>📓 Dans ton carnet · En tu cuaderno :<br><i>${esc(ST.carnet[n])}</i></p>`;
  if (pis > 1) h += `<p class="es">${pis} pistas usadas : sin bonus de cofre perfecto.</p>`;
  h += `</div><button class="btn" id="bcont">Continuer<span class="es">Seguir</span></button>`;
  $('#app').innerHTML = h; window.scrollTo(0, 0);
  let tm = null;
  const go = () => { clearTimeout(tm); inicio(); };
  tm = setTimeout(go, ST.carnet[n] || ST.reglas[n] ? 12000 : 5000);
  $('#bcont').onclick = go;
}

function enviarEspabox() {
  const c = [];
  for (const d of Object.keys(ST.casos)) { const v = ST.casos[d]; if (v.ok) c.push([+d, v.ts, v.p || 0]); }
  const json = JSON.stringify({ sc: SC.id, t: ST.token, c });
  const p = btoa(unescape(encodeURIComponent(json))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  location.href = SC.espabox_url.replace(/\/$/, '') + '/cofres/recibir?p=' + p;
}

/* ---------- Compteur en ligne (Google Sheet) ---------- */
let enviando = false;
async function vaciarCola() {
  if (!SC || !SC.contador_url || enviando || !ST || !ST.cola.length || !navigator.onLine) return;
  enviando = true;
  try {
    while (ST.cola.length) {
      await fetch(SC.contador_url, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(ST.cola[0]) });
      ST.cola.shift(); guardar();
    }
  } catch (e) {}
  enviando = false;
}

  $('#pr').onclick = () => { if (ESSAI || confirm('Effacer la progression de test ?')) { ST.casos = {}; ST.claves = {}; ST.carnet = {}; ST.reglas = {}; if (ESSAI) ST.metodo = 0; guardar(); ESSAI ? vistaMetodo() : inicio(); } };
}
function solucionDe(c) {
  const o = {};
  for (const k of ['solucion', 'claro', 'correcta', 'clave']) if (c[k] != null) o[k] = L(c[k]);
  if (c.escena) o.objetivo = c.escena.objetivo + ' (' + c.escena.items[c.escena.objetivo].e + ')';
  if (c.tipo === 'acusacion') o.culpable = SC.culpable;
  if (c.preguntas) o.respuestas = (L(c.preguntas) || []).map(q => q.c);
  if (c.ecoute) o.ecoute = (L(c.ecoute) || []).map(it => it.o ? it.o[it.c] : it.r);
  if (c.tipo === 'investigacion') {
    if (c.hipotesis) o.hipotesis = L(c.hipotesis.correcta);
    if (c.pruebas) o.pruebas = (L(c.pruebas) || []).map(q => q.c);
    if (c.deduccion) o.deduccion = L(c.deduccion.correcta);
    const I = L(c.informe); if (I) o.informe = I.modo === 'libre' ? 'libre : ' + (I.obligatorio || []).map(g => g.lab).join(' + ') : (I.piezas || []).join(' ');
    if (c.cierre) o.cofre = L(c.cierre.solucion);
  }
  return o;
}

/* ===== MÉCANIQUES (chacune : fonction(el, caso) → {check, stop?}) =====
   check() renvoie true (réussi), false (raté) ou null (pas fini). */
const MEC = {};

MEC.candado = (el, c) => {
  const tipo = c.candado || 'digitos', sol = String(L(c.solucion)).toUpperCase();
  el.innerHTML = `<p>🔒 ${esc(L(c.enunciado))}</p>`;
  if (tipo === 'digitos' || tipo === 'letras') {
    const alfa = tipo === 'digitos' ? '0123456789' : 'ABCDEFGHIJKLMNÑOPQRSTUVWXYZ';
    const n = [...sol].length, v = Array(n).fill(0);
    const w = document.createElement('div'); w.className = 'wheels';
    for (let i = 0; i < n; i++) {
      const d = document.createElement('div'); d.className = 'wheel';
      d.innerHTML = `<button aria-label="+">▲</button><span>${alfa[0]}</span><button aria-label="-">▼</button>`;
      const sp = d.querySelector('span'), [up, dn] = d.querySelectorAll('button');
      up.onclick = () => { v[i] = (v[i] + 1) % alfa.length; sp.textContent = alfa[v[i]]; };
      dn.onclick = () => { v[i] = (v[i] - 1 + alfa.length) % alfa.length; sp.textContent = alfa[v[i]]; };
      w.appendChild(d);
    }
    el.appendChild(w);
    return { check: () => v.map(i => alfa[i]).join('') === sol };
  }
  if (tipo === 'direcciones') {
    const seq = [], sd = document.createElement('div'), pad = document.createElement('div');
    sd.className = 'seq'; pad.className = 'pad';
    ['', '↑', '', '←', '⌫', '→', '', '↓', ''].forEach(k => {
      const b = document.createElement('button'); b.textContent = k;
      if (!k) b.style.visibility = 'hidden';
      else b.onclick = () => { if (k === '⌫') seq.pop(); else seq.push(k); sd.textContent = seq.join(''); };
      pad.appendChild(b);
    });
    el.append(sd, pad);
    return { check: () => seq.length ? seq.join('') === sol : null };
  }
  /* colores */
  const pal = c.colores || { rojo: '#d63b3b', verde: '#2f9e55', azul: '#2f6fd6', amarillo: '#f2c230', blanco: '#f4f4f4' };
  const solA = sol.toLowerCase().split(',').map(x => x.trim()), seq = [];
  const sd = document.createElement('div'); sd.className = 'seq';
  const dib = () => { sd.innerHTML = seq.map(n => `<span style="display:inline-block;width:26px;height:26px;border-radius:50%;background:${pal[n]};margin:0 3px;vertical-align:middle"></span>`).join(''); };
  const row = document.createElement('div'); row.className = 'row'; row.style.justifyContent = 'center';
  for (const nom of Object.keys(pal)) {
    const b = document.createElement('button'); b.className = 'swatch'; b.style.background = pal[nom]; b.title = nom; b.setAttribute('aria-label', nom);
    b.onclick = () => { seq.push(nom); dib(); }; row.appendChild(b);
  }
  const del = document.createElement('button'); del.className = 'btn sec'; del.textContent = '⌫ Effacer · Borrar';
  del.onclick = () => { seq.pop(); dib(); };
  el.append(sd, row, del);
  return { check: () => seq.length ? seq.join(',') === solA.join(',') : null };
};

MEC.telefono = (el, c) => {
  const ph = document.createElement('div'); ph.className = 'phone';
  ph.innerHTML = `<div class="top">📱 ${esc(c.contacto || '')}</div>` + (c.mensajes || []).map(m =>
    `<div class="bub ${m.de === 'yo' ? 'yo' : 'el'}">${esc(L(m.texto))}${m.audio ? `<button data-a="${esc(m.audio)}">🔊</button>` : ''}</div>`).join('');
  ph.querySelectorAll('[data-a]').forEach(b => b.onclick = () => audio(b.dataset.a));
  el.appendChild(ph);
  const p = document.createElement('p'); p.innerHTML = '<b>' + esc(L(c.pregunta)) + '</b>'; el.appendChild(p);
  const get = opciones(el, L(c.opciones) || [], c.mezclar);
  return { check: () => get() < 0 ? null : get() === c.correcta };
};

MEC.interrogatorio = (el, c) => {
  el.innerHTML = `<p><b>🕵️ ${esc(L(c.pregunta) || '¿Quién dice la verdad?')}</b></p>`;
  let s = -1; const bs = [];
  (c.testigos || []).forEach((t, i) => {
    const b = document.createElement('button'); b.className = 'testigo';
    b.innerHTML = `<span class="em">${esc(t.emoji || '🙂')}</span><span><b>${esc(t.nombre)}</b><br>${esc(L(t.texto))}</span>`;
    b.onclick = () => { s = i; bs.forEach(x => x.classList.toggle('sel', x === b)); if (t.audio) audio(t.audio); };
    el.appendChild(b); bs.push(b);
  });
  return { check: () => s < 0 ? null : s === c.correcta };
};

const ABC = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
const SIMB = ['🎄','⭐','🔔','🎁','❄','🍬','🧦','🦌','🎅','🌟','🍪','🎶','🪅','🥁','🎺','🌵','🍇','🎆','🧨','🌙','⛄','🎀','🧸','🎈','🍊','🐑'];
function cesar(t, k) { return [...t].map(ch => { const i = ABC.indexOf(ch); return i < 0 ? ch : ABC[((i + k) % 26 + 26) % 26]; }).join(''); }
MEC.cifrado = (el, c) => {
  const claro = String(L(c.claro)).normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase();
  const modo = c.cifra || 'cesar', k = c.desplazamiento || 3;
  let cod;

function normEsp(s) { return String(s == null ? '' : s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9ñ]+/g, ' ').trim(); }

let VOIX_ES = null;
function voixEspagnole() {

    const choisir = () => {
      const vs = speechSynthesis.getVoices().filter(v => /^es([-_]|$)/i.test(v.lang));
      return vs.find(v => /es[-_]ES/i.test(v.lang) && /google|natural|online/i.test(v.name)) || vs.find(v => /es[-_]ES/i.test(v.lang)) || vs.find(v => /es[-_](MX|US|419)/i.test(v.lang)) || vs[0] || null;
    };

    };
    const ordre = melange(fichas.length).map(i => fichas[i]);
    zona.append(linea, reserve); if (champ) zona.appendChild(champ);
    dessiner();
    rapport = () => {
      if (!dans.length) return null;
      if (dans.length !== piezas.length || dans.some((f, k) => f.ok !== k)) { alerte("L'ordre n'est pas encore bon : relis le modèle."); return false; }
      if (champ) {
        const v = champ.value.trim(); if (!v) { alerte('Écris aussi le mot qui manque.'); return false; }
        if (!(I.acepta || [piezas[hueco]]).some(a => normEsp(a) === normEsp(v))) { alerte('Le mot « ' + v + ' » ne convient pas encore. Pense à la règle découverte.'); return false; }
        return piezas.map((p, i) => i === hueco ? v : p).join(' ');
      }
      return piezas.join(' ');
    };
  }
  function suivante() { e++; pintar(); return 'next'; }
  pintar();
  return {
    etiqueta: () => ({ indices: "🔍 J'ai fini de chercher<span class=\"es\">He terminado</span>", hipotesis: '✅ Vérifier mon hypothèse<span class="es">Comprobar</span>', pruebas: '✅ Vérifier les preuves<span class="es">Comprobar</span>', deduccion: '🔎 Valider ma déduction<span class="es">Deducir</span>', informe: '✍️ Noter dans mon carnet<span class="es">Anotar</span>', cierre: '🔓 Ouvrir le coffre<span class="es">Abrir el cofre</span>' })[etapas[e]],
    vide: () => etapas[e] === 'informe' ? "Écris d'abord ta phrase · Escribe primero" : 'Choisis une réponse · Elige una respuesta',
    stop: () => { try { speechSynthesis.cancel(); } catch (x) {} arreterMp3(); if (sub && sub.stop) sub.stop(); },
    check: () => {
      const x = etapas[e];
      if (x === 'indices') return suivante();
      if (x === 'hipotesis') {
        const s = get(); if (s < 0) return null;
        if (s === L(c.hipotesis.correcta)) return suivante();
        const op = (L(c.hipotesis.opciones) || [])[s] || {};
        surligner(op.contra || []);
        alerte((op.contra || []).length ? 'Regarde les mots encadrés en rouge dans le document : ils contredisent cette hypothèse.' : 'Relis tes indices : ils ne vont pas dans ce sens.');
        return false;
      }
      if (x === 'pruebas') {
        const P = L(c.pruebas) || [], r = get();
        if (r.some(v => v < 0)) return null;
        const faux = P.filter((q, k) => r[k] !== q.c);
        if (!faux.length) return suivante();
        surligner([].concat(...faux.map(q => q.donde || [])));
        alerte(faux.length + ' preuve' + (faux.length > 1 ? 's' : '') + ' à revoir : la réponse est près des mots encadrés.');
        return false;
      }
      if (x === 'deduccion') {
        const s = get(); if (s < 0) return null;
        if (s === L(c.deduccion.correcta)) { ST.reglas[c.dia] = L(c.deduccion.regla); guardar(); return suivante(); }
        alerte('Compare encore les mots en jaune : qu\'ont-ils en commun ?'); return false;
      }
      if (x === 'informe') {
        const v = rapport(); if (v === null || v === false) return v;
        ST.carnet[c.dia] = v; guardar(); return suivante();
      }
      if (x === 'cierre') return sub ? sub.check() : true;
      return true;
    }
  };
};

cargar();

<script>
/* ===== LECTURE AUTOMATIQUE « 🎬 Regarder » (10/11/2026, REGARDER_2026_11_10) =====
   Seulement en mode essai / prof : un élève virtuel joue un coffre devant la prof, étape par étape.

(function () {

  /* ---------- Temps (pause, étape suivante, arrêt) ---------- */
  class Arret extends Error {}
  async function attendre(ms) {

  }
  const lecture = txt => Math.min(14000, 2500 + String(txt || '').length * 35);
  function legende(fr, detail) {
    const c = document.querySelector('#rg-bar .cap');

  }

  /* ---------- Gestes visibles ---------- */
  async function toucher(el, pause) {

  async function taper(el, texte) {

  const bouton = (racine, txt) => [...racine.querySelectorAll('.opt')].find(b => b.textContent === txt);

  }
  const etape = () => { const a = document.querySelector('#mec .etapas span.act'); return a ? a.textContent : ''; };

  /* ---------- Les mécaniques ---------- */
  async function coffre(z, ci) {

    } else if (T === 'escena') {

      const ts = [...z.querySelectorAll('.testigo')];
      for (const t of ts) { t.scrollIntoView({ behavior: 'smooth', block: 'center' }); t.classList.add('rg-doigt'); await attendre(lecture(t.textContent) * 0.6); t.classList.remove('rg-doigt'); }
      await toucher(ts[ci.correcta], 800);
    } else if (T === 'cifrado') {
      legende('Il décode le message secret.', 'Descifra el mensaje.');
      const r = z.querySelector('#rr'), k = ci.desplazamiento || 3;
      if (r) { r.scrollIntoView({ behavior: 'smooth', block: 'center' }); r.classList.add('rg-doigt'); for (let s = 1; s <= k; s++) { await attendre(500); r.value = s; r.dispatchEvent(new Event('input')); } await attendre(1500); r.classList.remove('rg-doigt'); }

    } else if (T === 'cronometro') {

      await toucher(z.querySelector('#cgo'));

  async function enquete(c) {
    const D = c.documento || {}, texto = String(L(D.texto) || '');

        else {
          for (let i = 0; i < I.piezas.length; i++) { const t = i === I.hueco && I.modo === 'hueco' ? '…' : I.piezas[i]; await toucher([...z.querySelectorAll('.tiles .tile')].find(x => x.textContent === t), 300); }

  async function jouer(dia) {
    const c = caso(dia); if (!c) return;
    delete ST.casos[dia]; guardar();
    abrirCaso(dia);

    else { await coffre($('#mec'), c); await valider(800); }

      legende('🎉 Coffre ouvert ! Récompense, décimo et ligne du carnet.', '¡Cofre abierto!');

  /* ---------- Interface ---------- */
  function barre() {

  async function lancer(jours, niv, vit) {

    catch (e) { if (!(e instanceof Arret)) { console.error(e); legende('⚠️ Arrêt : ' + e.message, 'Note le jour et l\'étape pour Claude.'); try { await new Promise(r => setTimeout(r, 6000)); } catch (x) {} } }

    const b = $('#rg-bar'); if (b) b.remove();
    document.body.classList.remove('rg-joue'); R.on = false;

  }
  function panneau() {
    const p = document.createElement('div'); p.id = 'rg-pan';
    const opts = (SC.casos || []).map(c => `<option value="${c.dia}">Jour ${c.dia} ${esc(c.bandera || '')} ${esc(c.pais || '')} — ${esc(String(L(c.titulo) || '').slice(0, 40))}</option>`).join('');
    p.innerHTML = `<div class="box"><h3>🎬 Regarder un élève jouer</h3>

      <label>Niveau</label><select id="rg-n">${NIVS.map(([k, t]) => `<option value="${k}">${t}</option>`).join('')}</select>
      <label class="ck"><input type="checkbox" id="rg-son" ${R.son ? 'checked' : ''}> 🔊 Avec le son (voix espagnole)</label>
      <label class="ck"><input type="checkbox" id="rg-err" ${R.erreur ? 'checked' : ''}> Montrer aussi une erreur (hypothèse)</label>
      <button class="bt" id="rg-go">▶ Regarder</button><button class="bt sec" id="rg-no">Annuler</button></div>`;
    document.body.appendChild(p);
    $('#rg-no').onclick = () => p.remove();
