*{box-sizing:border-box}

button.sec{background:#fff;color:var(--acc);border:2px solid var(--acc)}
button:disabled{opacity:.5}
.ex{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--acc);font-weight:700;margin:18px 0 6px}
.q{border:1px solid var(--line);border-radius:10px;padding:12px;margin:8px 0}
.q p{margin:0 0 8px;font-weight:600}
.opt{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:8px;border:1px solid var(--line);margin:6px 0;cursor:pointer}
.opt input{margin-top:4px}
.q.ok{border-color:var(--ok);background:#eefaf2} .q.ko{border-color:var(--ko);background:#fdf0ee}
.fb{font-size:14px;margin-top:6px} .fb.ok{color:var(--ok)} .fb.ko{color:var(--ko)}
.note{font-size:44px;font-weight:800;color:var(--acc);text-align:center;margin:6px 0}
.center{text-align:center} .mut{color:var(--mut);font-size:14px}
.id{background:var(--acc2);border-radius:8px;padding:8px 12px;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.grid a{display:block;text-align:center;background:#fff;border:1.5px solid var(--line);border-radius:8px;padding:10px;color:var(--ink);text-decoration:none;font-size:14px}
.big{display:block;width:100%;text-align:left;margin:10px 0;padding:16px;font-size:17px}
.big small{display:block;font-weight:400;opacity:.9;font-size:14px;margin-top:2px}
.aide{background:#f4f0ff;border:1px solid #d4c8fb;border-radius:8px;padding:8px 12px;margin:10px 0;font-size:15px}
.rec{display:flex;align-items:center;gap:14px;margin:14px 0}
#rec.on{background:#c0392b;animation:pl 1s infinite} @keyframes pl{50%{opacity:.6}}
#tm{font-variant-numeric:tabular-nums;font-weight:700;font-size:18px}
audio{width:100%;margin:8px 0}
.status{font-size:14px;border-radius:8px;padding:8px 12px;margin-top:10px}
.status.ok{background:#eefaf2;color:var(--ok)} .status.wait{background:#fff8e5;color:#8a6212} .status.err{background:#fdf0ee;color:var(--ko)}

.rules{padding-left:20px;line-height:1.7}

async function detectEspaBox(){
  try{
    const ctl = new AbortController(); setTimeout(()=>ctl.abort(), 1500);
    const r = await fetch(CONFIG.ESPABOX_PROFIL, {credentials:"same-origin", signal:ctl.signal});
    if(!r.ok) return null;
    const j = await r.json();
    const p = j.profil || j;
    const nom = p.nom_affiche || p.display_name || [p.prenom, p.nom].filter(Boolean).join(" ") || p.nom || p.identifiant;
    if(!nom) return null;
    return {classe: p.classe || "", nom: nom, identifiant: p.identifiant || p.id || ""};
  }catch(e){ return null; }
}

const SEC_Q = 15;   // secondes par question (modifiable)

function quiz(){

  app.innerHTML = `<div class="card">${idLine()}<h2>📝 Avant de commencer</h2>

function quizRun(tot){
  const Q = QUIZ[n][s];
  let h = `<div class="card"><div class="timer" id="tmr"><span id="tt">${fmt(tot)}</span><div class="bar"><i id="tb"></i></div></div>${idLine()}`;
  let cur = "";
  Q.q.forEach((q, i) => {
    if(q.ex !== cur){ cur = q.ex; h += `<div class="ex">${esc(cur)}</div>`; }
    h += `<div class="q" id="b${q.id}"><p>${i+1}. ${esc(q.p)}</p>`;
    if(q.k === "choice") q.o.forEach(o => h += `<label class="opt"><input type="radio" name="${q.id}" value="${esc(o)}"> <span>${esc(o)}</span></label>`);
    else h += `<input type="text" name="${q.id}" autocomplete="off" autocapitalize="off" spellcheck="false">`;
    h += `<div class="fb" id="f${q.id}"></div></div>`;
  });
  h += `<div class="center" style="margin-top:14px"><button id="send">Valider mes réponses</button></div></div>`;
  app.innerHTML = h;
  $("#send").onclick = () => correct(false);
  const end = Date.now() + tot*1000;
  clearInterval(tq);
  tq = setInterval(() => {
    const left = Math.max(0, Math.round((end - Date.now())/1000));
    const e = $("#tt"); if(!e){ clearInterval(tq); if(EMB) pm2({t:-1}); return; }
    e.textContent = fmt(left); if(EMB) pm2({t:left}); $("#tb").style.width = (100*left/tot) + "%";
    if(left <= 15) $("#tmr").classList.add("low");
    if(left <= 0){ clearInterval(tq); correct(true); }
  }, 500);
}

async function correct(auto){
  clearInterval(tq); if(EMB) pm2({t:-1}); if(EMB) pm2({t:-1});
  const Q = QUIZ[n][s];
  let blank = 0;
  const rep = Q.q.map(q => {
    let v = "";
    if(q.k === "choice"){ const r = document.querySelector(`input[name="${q.id}"]:checked`); v = r ? r.value : ""; }
    else v = document.querySelector(`input[name="${q.id}"]`).value.trim();
    if(!v) blank++;
    return v;
  });
  if(!auto && blank && !confirm(`Il reste ${blank} question(s) sans réponse. Valider quand même ?`)) return;
  const res = {type:"quiz", niveau:n, seance:+s, classe:ident.classe, nom:ident.nom, identifiant:ident.identifiant,
               reponses:Q.q.map((q,i)=>({id:q.id, r:rep[i]})), date:new Date().toISOString(), source:mode};
  const btn = $("#send"); btn.disabled = true; btn.textContent = "Correction en cours…";
  let R;
  try{ R = await corriger(res); }
  catch(e){
    btn.disabled = false; btn.textContent = "Valider mes réponses";
    let d = $("#er"); if(!d){ d = document.createElement("div"); d.id = "er"; d.className = "status err"; btn.parentNode.appendChild(d); }
    d.textContent = e.message === "noendpoint" ? "⚠️ Le professeur n'a pas encore activé la correction : montre-lui cet écran."
                                                : "📶 Pas de connexion : tes réponses sont conservées, réessaie dans un instant.";
    return;
  }
  const byId = {}; (R.detail||[]).forEach(x => byId[x.id] = x);
  Q.q.forEach(q => {
    const x = byId[q.id] || {ok:0}, good = !!x.ok;
    $("#b"+q.id).classList.add(good?"ok":"ko");
    $("#f"+q.id).className = "fb " + (good?"ok":"ko");
    $("#f"+q.id).textContent = good ? "✔ Correct" : "✘ Réponse attendue : " + (x.att || "");
    $("#b"+q.id).querySelectorAll("input").forEach(i => i.disabled = true);
  });
  ls(`espro_done_${n}_${s}_${ident.nom}`, R.tentative || 1);
  btn.remove();
  const box = document.createElement("div"); box.className = "card center";
  box.innerHTML = `<div class="mut">Ta note</div><div class="note">${String(R.note20).replace(".",",")} / 20</div>
    <div>${R.score} bonne(s) réponse(s) sur ${R.total}${R.tentative>1?` · tentative n° ${R.tentative}`:""}</div><div class="status ok">✅ Résultat envoyé à ton professeur.</div>
    <p><button class="sec" onclick="quiz()">Refaire le quiz</button> <button onclick="oral()">🎤 Passer à l'oral</button></p>`;
  app.prepend(box); window.scrollTo(0,0);
}
async function corriger(res){
  if(mode === "espabox"){
    const r = await fetch(CONFIG.ESPABOX_POST, {method:"POST", credentials:"same-origin", headers:{"Content-Type":"application/json"}, body:JSON.stringify(res)});
    if(!r.ok) throw new Error("HTTP " + r.status);
    return await r.json();
  }
  if(!CONFIG.GOOGLE_ENDPOINT) throw new Error("noendpoint");
  const r = await fetch(CONFIG.GOOGLE_ENDPOINT, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify(res)});
  const j = await r.json();
  if(!j.ok) throw new Error(j.error || "erreur");
  return j;
}

function b64ToBlob(b64, mime){ const bin = atob(b64), a = new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) a[i]=bin.charCodeAt(i); return new Blob([a], {type:mime}); }
async function post(res){
  if(res.type === "oral" && res.source === "espabox"){
    const fd = new FormData();
    ["niveau","seance","titre","nom","classe","duree","mime","date"].forEach(k => fd.append(k, res[k]));
    fd.append("audio", b64ToBlob(res.audio, res.mime), "oral." + (res.mime.indexOf("mp4")>-1?"m4a":res.mime.indexOf("ogg")>-1?"ogg":"webm"));
    const r = await fetch(CONFIG.ESPABOX_ORAL, {method:"POST", credentials:"same-origin", body:fd});
    if(!r.ok) throw new Error("HTTP " + r.status);
    return;
  }
  if(res.source === "espabox" && false){
    const r = await fetch(CONFIG.ESPABOX_POST, {method:"POST", credentials:"same-origin", headers:{"Content-Type":"application/json"}, body:JSON.stringify(res)});
    if(!r.ok) throw new Error("HTTP " + r.status);
    return;
  }
  if(!CONFIG.GOOGLE_ENDPOINT) throw new Error("noendpoint");
  await fetch(CONFIG.GOOGLE_ENDPOINT, {method:"POST", mode:"no-cors", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify(res)});
}

let rec = null, chunks = [], blob = null, mime = "", timer = null, t0 = 0, dur = 0;

  $("#snd").onclick = sendOral;

function status(cls, txt){ const d = $("#st"); d.className = "status " + cls; d.textContent = txt; }
async function startRec(max){
  if(!navigator.mediaDevices || !window.MediaRecorder){ status("err", "Ce navigateur ne permet pas d'enregistrer. Utilise Chrome, Firefox ou Safari récent" + (location.protocol!=="https:"?" et une adresse en https://":"") + "."); return; }
  let stream;
  try{ stream = await navigator.mediaDevices.getUserMedia({audio:true}); }
  catch(e){ status("err", "Micro refusé : autorise le micro pour cette page (icône 🔒 dans la barre d'adresse), puis réessaie."); return; }
  mime = ["audio/webm;codecs=opus","audio/mp4","audio/ogg;codecs=opus","audio/webm"].find(m => MediaRecorder.isTypeSupported(m)) || "";
  rec = new MediaRecorder(stream, mime ? {mimeType:mime, audioBitsPerSecond:32000} : {});
  chunks = [];
  rec.ondataavailable = e => e.data.size && chunks.push(e.data);
  rec.onstop = () => {
    stream.getTracks().forEach(t => t.stop());
    blob = new Blob(chunks, {type: rec.mimeType || mime || "audio/webm"});
    $("#pl").src = URL.createObjectURL(blob); $("#pl").hidden = false; $("#act").hidden = false;
    $("#rec").classList.remove("on"); $("#rec").textContent = "● Enregistrer à nouveau";
  };
  rec.start(1000); t0 = Date.now(); $("#rec").classList.add("on"); $("#rec").textContent = "■ Arrêter"; status("wait", "Enregistrement en cours… parle clairement, près du micro.");
  timer = setInterval(() => { dur = Math.round((Date.now()-t0)/1000); $("#tm").textContent = `${fmt(dur)} / ${fmt(max)}`; if(dur >= max) stopRec(); }, 250);
}
function stopRec(){ clearInterval(timer); if(rec && rec.state === "recording") rec.stop(); status("wait", "Réécoute-toi. Si tu es satisfait·e, envoie ; sinon, recommence."); }
function blobToB64(b){ return new Promise((ok, ko) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(",")[1]); r.onerror = ko; r.readAsDataURL(b); }); }
async function sendOral(){
  if(!blob) return;
  $("#snd").disabled = true; status("wait", "Envoi en cours…");
  const res = {type:"oral", niveau:n, seance:+s, titre:QUIZ[n][s].t, tache:QUIZ[n][s].or.t, classe:ident.classe, nom:ident.nom,
               identifiant:ident.identifiant, duree:dur, mime:blob.type, date:new Date().toISOString(), source:mode, audio: await blobToB64(blob)};
  try{ await post(res); ls(`espro_oral_${n}_${s}_${ident.nom}`, 1); status("ok", "✅ Enregistrement envoyé à ton professeur. ¡Buen trabajo!"); }
  catch(e){
    $("#snd").disabled = false;
    if(e.message === "noendpoint"){ status("err", "⚠️ Le professeur n'a pas encore activé l'envoi : montre-lui cet écran."); return; }
    const q = ls("espro_queue") || []; q.push(res);
    try{ localStorage.setItem("espro_queue", JSON.stringify(q)); status("err", "📶 Pas de connexion : l'enregistrement est gardé sur ce téléphone et partira automatiquement la prochaine fois."); }
    catch(x){ status("err", "📶 Pas de connexion et mémoire pleine : garde cette page ouverte et appuie de nouveau sur Envoyer quand tu as du réseau."); }
  }
}

async function send(res){
  const st = $("#st");
  try{ await post(res); st.className = "status ok"; st.textContent = "✅ Résultat envoyé à ton professeur."; }
  catch(e){
    const q = ls("espro_queue") || []; q.push(res); ls("espro_queue", q);
    st.className = "status err";
    st.textContent = e.message === "noendpoint" ? "⚠️ Le professeur n'a pas encore activé l'envoi des notes : montre-lui cet écran."
                                                : "📶 Pas de connexion : le résultat est gardé sur ce téléphone et sera envoyé automatiquement la prochaine fois.";
  }
}
async function flushQueue(){
  const q = ls("espro_queue") || []; if(!q.length) return;
  const rest = [];
  for(const r of q){ try{ await post(r); }catch(e){ rest.push(r); } }
  ls("espro_queue", rest);
}

(async function start(){
  if(!QUIZ[n] || !QUIZ[n][s]){ home(); return; }
  document.body.dataset.n = n;
  $("#h1").textContent = `S${s} · ${QUIZ[n][s].t}`;
  $("#h2").textContent = `Español profesional · ${NIV[n]} · Módulo ${QUIZ[n][s].m}`;
  document.title = `Quiz S${s} — ${NIV[n]}`;
  const eb = await detectEspaBox();
  if(eb){ ident = eb; mode = "espabox"; }
  else if(location.pathname.indexOf("/static/apps/") !== -1){
    app.innerHTML = '<div class="card center"><h2>Connecte-toi à EspaBox</h2><p>Pour que ta note soit enregistrée, connecte-toi d\'abord avec ton identifiant EspaBox, puis rouvre ce quiz.</p><p><button onclick="location.href=\'/\'">Aller à la connexion</button></p></div>';
    return;
  }
  flushQueue();
  if(ident) go(); else identForm();
})();
</script>
